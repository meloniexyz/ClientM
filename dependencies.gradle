// Performance stack ClientM ships with. Present in runClient, not baked into our jar.
dependencies {
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:Angelica:2.2.46:dev")
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:Hodgepodge:2.7.197:dev")
}

// Windows Defender quarantines GTNHExtLib 1.0.4 (pulled in via GTNHLib) on download; use the newer release.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.github.GTNewHorizons' && details.requested.name == 'GTNHExtLib') {
            details.useVersion('1.1.0')
        }
    }
}

// Shader compilers that Angelica's experimental Vulkan / Direct3D 12 renderer needs. Only used by the Java 21
// dev launch (runClient21) when that renderer is switched on.
dependencies {
    lwjgl3Classpath("org.lwjgl:lwjgl-shaderc:3.4.2")
    lwjgl3Classpath("org.lwjgl:lwjgl-shaderc:3.4.2:natives-windows")
    lwjgl3Classpath("org.lwjgl:lwjgl-spvc:3.4.2")
    lwjgl3Classpath("org.lwjgl:lwjgl-spvc:3.4.2:natives-windows")
}
